# Local development stack:  docker compose up --build
# API on http://localhost:8080 (try http://localhost:8080/health)
#
# Postgres and Redis are started now but only used from phase 2:
#   Postgres = saved rounds, replays, leaderboards
#   Redis    = SignalR backplane so several API containers can share live updates

services:
  api:
    build:
      context: .
      dockerfile: src/Tradeground.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Database=tradeground;Username=tradeground;Password=local_dev_only
      ConnectionStrings__Redis: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradeground
      POSTGRES_USER: tradeground
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeground -d tradeground"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Tradeground.sln

      - name: Build (warnings are errors)
        run: dotnet build Tradeground.sln --no-restore --configuration Release

      - name: Unit, property and integration tests
        run: >
          dotnet test Tradeground.sln --no-build --configuration Release
          --logger trx --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker:
    name: Docker image builds
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --file src/Tradeground.Api/Dockerfile --tag tradeground-api:${{ github.sha }} .

name: Nightly

# Slow checks that would make every pull request wait: run them once a night instead.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: Engine benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Run benchmarks
        run: dotnet run --configuration Release --project benchmarks/Tradeground.Benchmarks -- --filter "*" --exporters json markdown
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts
